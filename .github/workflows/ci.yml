# =============================================================
#  Banking AI Copilot — CI Pipeline
#  Runs on every push/PR to main and dev branches
#  Steps: lint → test → build Docker images → push to registry
# =============================================================

name: CI — Test & Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/trustnova

jobs:
  # ── Step 1: Run Tests ──────────────────────────────────
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database and Vector Store
        env:
          DATABASE_URL: "sqlite:///./banking.db"
          EMBEDDING_BACKEND: "sentence_transformers"
          VECTOR_DB: "chroma"
          CHROMA_PERSIST_DIR: "data/chroma_db"
        run: |
          python -m src.data.generate_customers
          python -m src.data.generate_transactions
          python -m src.data.generate_interactions
          python -m src.data.generate_support_tickets
          python -m src.data.generate_fraud_alerts
          python -m src.data.generate_chat_transcripts
          python -m src.data.generate_complaints
          python -m src.data.etl_pipeline
          python -m src.rag.document_loader

      - name: Run pytest
        env:
          DATABASE_URL: "sqlite:///./banking.db"
          EMBEDDING_BACKEND: "sentence_transformers"
          VECTOR_DB: "chroma"
          CHROMA_PERSIST_DIR: "data/chroma_db"
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ── Step 2: Build Docker Images ────────────────────────
  build:
    name: "🐳 Build Docker Images"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: deployment/Dockerfile.backend
            context: .
          - service: frontend
            dockerfile: deployment/Dockerfile.frontend
            context: .
          - service: ml-service
            dockerfile: deployment/Dockerfile.ml
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed — ${{ matrix.service }}"

  # ── Step 3: Verify Build ───────────────────────────────
  verify:
    name: "✅ Verify"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 Docker images built and pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Images tagged: latest + ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
