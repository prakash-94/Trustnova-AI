# =============================================================
#  TrustNova AI — Deploy Pipeline
#  Triggered after CI passes on push to main
#  Builds only critical services (backend + frontend),
#  runs health checks, then tears down.
# =============================================================

name: Deploy — Docker Stack

on:
  workflow_run:
    workflows: ["CI — Test & Build"]
    types: [completed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: "🚀 Deploy"
    runs-on: ubuntu-latest
    # Only run when CI actually passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Log in so docker can cache-from GHCR layers built by CI
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "DATABASE_URL=sqlite:///./banking.db"      > .env
          echo "EMBEDDING_BACKEND=sentence_transformers" >> .env
          echo "VECTOR_DB=chroma"                        >> .env
          echo "CHROMA_PERSIST_DIR=data/chroma_db"       >> .env
          echo "CHROMA_COLLECTION=banking_docs"          >> .env
          echo "LLM_MODEL=llama-3.3-70b-versatile"         >> .env
          echo "LLM_PROVIDER=groq"                       >> .env
          echo "OPENAI_API_KEY=${OPENAI_API_KEY}"        >> .env
          echo "PINECONE_API_KEY=${PINECONE_API_KEY}"    >> .env
          echo "GROQ_API_KEY=${GROQ_API_KEY}"            >> .env

      # ── Build only the two critical services ──────────────────
      # ml-service, prometheus, grafana are skipped here to keep
      # deploy fast and reliable in a CI runner.
      - name: Build backend image
        run: |
          docker build \
            -f deployment/Dockerfile.backend \
            -t trustnova-backend:ci \
            --cache-from ghcr.io/${{ github.repository_owner }}/trustnova-backend:latest \
            .
          echo "✅ Backend image built"

      - name: Build frontend image
        run: |
          docker build \
            -f deployment/Dockerfile.frontend \
            -t trustnova-frontend:ci \
            --cache-from ghcr.io/${{ github.repository_owner }}/trustnova-frontend:latest \
            .
          echo "✅ Frontend image built"

      # ── Start ChromaDB + Backend ───────────────────────────────
      - name: Start ChromaDB
        run: |
          docker network create copilot-network || true
          docker run -d \
            --name copilot-chromadb \
            --network copilot-network \
            -e IS_PERSISTENT=TRUE \
            -e ANONYMIZED_TELEMETRY=FALSE \
            chromadb/chroma:latest
          echo "ChromaDB started, waiting 15s..."
          sleep 15

      - name: Start Backend
        run: |
          docker run -d \
            --name copilot-backend \
            --network copilot-network \
            -p 8001:8001 \
            --env-file .env \
            -e CHROMA_HOST=copilot-chromadb \
            -e CHROMA_PORT=8000 \
            trustnova-backend:ci
          echo "Backend started, waiting 60s for initialization..."
          sleep 60

      - name: Health check — Backend
        run: |
          SUCCESS=false
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy on attempt $i"
              SUCCESS=true
              break
            fi
            echo "Attempt $i/12: backend returned $STATUS — retrying in 15s..."
            sleep 15
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Backend did not become healthy after 3 minutes"
            docker logs copilot-backend --tail=60
            exit 1
          fi

      # ── Start Frontend ─────────────────────────────────────────
      - name: Start Frontend
        run: |
          docker run -d \
            --name copilot-frontend \
            --network copilot-network \
            -p 80:80 \
            trustnova-frontend:ci
          echo "Frontend started, waiting 20s..."
          sleep 20

      - name: Health check — Frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend healthy (HTTP $STATUS)"
          else
            echo "⚠️ Frontend returned $STATUS — dumping logs"
            docker logs copilot-frontend --tail=30
            # Non-fatal: nginx might return 304 or other valid codes
            if [ "$STATUS" = "000" ]; then
              exit 1
            fi
          fi

      # ── Summary ────────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "## 🚀 Deployment Smoke Test — Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | Port | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | 8001 | ✅ 200 |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | 80   | ✅ 200 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Images built with GHA layer cache from GHCR." >> $GITHUB_STEP_SUMMARY

      # ── Tear down (always runs) ────────────────────────────────
      - name: Tear down containers
        if: always()
        run: |
          docker rm -f copilot-backend copilot-frontend copilot-chromadb 2>/dev/null || true
          docker network rm copilot-network 2>/dev/null || true
          echo "Stack torn down."
