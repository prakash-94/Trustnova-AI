# =============================================================
#  Prometheus Scrape Configuration
#  Banking AI Copilot — Monitoring Stack
# =============================================================

global:
  scrape_interval: 15s          # Scrape every 15 seconds
  evaluation_interval: 15s      # Evaluate rules every 15 seconds
  scrape_timeout: 10s

scrape_configs:
  # ── FastAPI Backend Metrics ────────────────────────────
  - job_name: "copilot-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
          environment: "local"

  # ── ML Inference Service Metrics ───────────────────────
  - job_name: "copilot-ml-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8001"]
        labels:
          service: "ml-service"
          environment: "local"

  # ── Prometheus Self-Monitoring ─────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
