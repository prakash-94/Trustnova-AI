# =============================================================
#  TrustNova AI — Nginx Configuration
#  Serves the React SPA and proxies all API routes to backend:8001
# =============================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 256;

    # ── Common proxy settings ─────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";

    # ── Static assets (Vite hashed files) ────────────────────
    location ~* \.(js|css|png|jpg|jpeg|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API: all backend routes → backend:8001 ────────────────
    # Chat has longer timeout (LLM can be slow)
    location /chat {
        proxy_pass            http://backend:8001;
        proxy_read_timeout    180s;
        proxy_connect_timeout  15s;
        proxy_send_timeout    180s;
        proxy_buffering       off;
        client_max_body_size  10M;
    }

    # Documents upload can be large
    location /documents {
        proxy_pass            http://backend:8001;
        proxy_read_timeout    180s;
        client_max_body_size  100M;
    }

    # All other API prefixes — standard 60s timeout
    location ~ ^/(auth|customers|accounts|transactions|loans|aml|kyc|risk|fraud|treasury|appointments|credit-cards|kpi|notifications|announcements|bug-reports|admin|access-requests|feedback|trust|health|docs|redoc|openapi\.json|metrics)(/|$) {
        proxy_pass            http://backend:8001;
        proxy_read_timeout    60s;
    }

    # ── ML Service ───────────────────────────────────────────
    location /ml/ {
        proxy_pass http://ml-service:8001/;
    }

    # ── Monitoring ───────────────────────────────────────────
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
    }

    # ── SPA fallback — serve index.html for all other paths ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
