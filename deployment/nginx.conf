# =============================================================
#  Banking AI Copilot — Nginx Configuration
#  Serves static frontend and reverse-proxies API calls
# =============================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # ── Global proxy settings ────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Frontend Static Files ────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache
    location ~* \.(css|js|png|jpg|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── API: Chat (longest timeout — GPT-4 can take 30s+) ───
    location /chat {
        proxy_pass http://backend/chat;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        proxy_buffering off;
        client_max_body_size 5M;
    }

    # ── API: Fraud ──────────────────────────────────────────
    location /fraud {
        proxy_pass http://backend/fraud;
        proxy_read_timeout 60s;
    }

    # ── API: Customer ───────────────────────────────────────
    location /customer {
        proxy_pass http://backend/customer;
        proxy_read_timeout 60s;
    }

    # ── API: Trust ──────────────────────────────────────────
    location /trust {
        proxy_pass http://backend/trust;
        proxy_read_timeout 60s;
    }

    # ── API: Documents (large uploads) ──────────────────────
    location /documents {
        proxy_pass http://backend/documents;
        proxy_read_timeout    120s;
        client_max_body_size  100M;
    }

    # ── API: Feedback ───────────────────────────────────────
    location /feedback {
        proxy_pass http://backend/feedback;
        proxy_read_timeout 60s;
    }

    # ── API: Health, Docs, Metrics ──────────────────────────
    location /health {
        proxy_pass http://backend/health;
    }

    location /docs {
        proxy_pass http://backend/docs;
    }

    location /redoc {
        proxy_pass http://backend/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend/openapi.json;
    }

    location /metrics {
        proxy_pass http://backend/metrics;
    }

    # ── ML Service Proxy ─────────────────────────────────────
    location /ml/ {
        proxy_pass http://ml-service:8001/;
    }

    # ── Monitoring ───────────────────────────────────────────
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
    }

    # ── SPA Fallback — all other routes serve index.html ────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 256;
}
