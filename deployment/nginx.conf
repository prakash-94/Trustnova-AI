# =============================================================
#  Banking AI Copilot — Nginx Configuration
#  Serves static frontend and reverse-proxies API calls
# =============================================================

server {
    listen 80;
    server_name localhost;

    # ── Frontend Static Files ────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets ────────────────────────────────────────
    location ~* \.(css|js|png|jpg|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── API: Chat ────────────────────────────────────────────
    # GPT-4 can take 30s+, so use 180s timeouts
    location /chat {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        proxy_read_timeout    180s;
        proxy_connect_timeout  15s;
        proxy_send_timeout    180s;
        proxy_buffering       off;
        client_max_body_size  10M;
    }

    # ── API: Fraud ───────────────────────────────────────────
    location /fraud {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host            $host;
        proxy_set_header      X-Real-IP       $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      Connection      "";
        proxy_read_timeout    60s;
    }

    # ── API: Customer ────────────────────────────────────────
    location /customer {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host            $host;
        proxy_set_header      X-Real-IP       $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      Connection      "";
        proxy_read_timeout    60s;
    }

    # ── API: Trust ───────────────────────────────────────────
    location /trust {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host            $host;
        proxy_set_header      X-Real-IP       $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      Connection      "";
        proxy_read_timeout    60s;
    }

    # ── API: Documents ───────────────────────────────────────
    location /documents {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host            $host;
        proxy_set_header      X-Real-IP       $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      Connection      "";
        proxy_read_timeout    180s;
        client_max_body_size  100M;
    }

    # ── API: Feedback ────────────────────────────────────────
    location /feedback {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host            $host;
        proxy_set_header      X-Real-IP       $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      Connection      "";
        proxy_read_timeout    60s;
    }

    # ── API: Health / Docs / Metrics ─────────────────────────
    location /health {
        proxy_pass       http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass       http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass       http://backend:8000/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass       http://backend:8000/metrics;
        proxy_set_header Host $host;
    }

    # ── ML Service ───────────────────────────────────────────
    location /ml/ {
        proxy_pass       http://ml-service:8001/;
        proxy_set_header Host $host;
    }

    # ── Monitoring ───────────────────────────────────────────
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
    }

    # ── SPA fallback (must be last) ──────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 256;
}
