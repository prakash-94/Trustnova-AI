# =============================================================
#  TrustNova AI — Docker Compose (full stack)
#
#  Images are built and pushed to GHCR by the CI pipeline.
#  Pull the latest CI-built images:
#    docker-compose pull
#    docker-compose up -d
#
#  Build from source and run locally:
#    docker-compose up --build
#
#  Individual service:
#    docker-compose up backend chromadb
# =============================================================

services:

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    image: ghcr.io/prakash-94/trustnova-backend:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: trusnova-backend
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite:////app/data/banking.db
      - CHROMA_PERSIST_DIR=data/chroma_db
      - CHROMA_COLLECTION=banking_docs
      - CHROMA_HOST=trusnova-chromadb
      - CHROMA_PORT=8000
      - VECTOR_DB=chroma
      - LLM_PROVIDER=groq
      - LLM_MODEL=llama-3.3-70b-versatile
      - EMBEDDING_BACKEND=sentence_transformers
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 120s    # entrypoint seeds DB on first start (~90s)
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── React Frontend (Nginx) ───────────────────────────────────
  frontend:
    image: ghcr.io/prakash-94/trustnova-frontend:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: trusnova-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── ML Inference Service ─────────────────────────────────────
  # Models are not in git — volume-mount pre-trained pkl files:
  #   docker run -v /path/to/models:/app/models ...
  # Or train locally: python -m src.models.model_zoo
  # then: docker cp models/. trusnova-ml:/app/models/
  ml-service:
    image: ghcr.io/prakash-94/trustnova-ml-service:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ml
    container_name: trusnova-ml
    ports:
      - "8003:8001"     # host:8003 → container:8001
    volumes:
      - models-data:/app/models   # mount pre-trained pkl files here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── ChromaDB Vector Store ────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: trusnova-chromadb
    ports:
      - "8002:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── Prometheus (Metrics) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: trusnova-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── Grafana (Dashboards) ─────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: trusnova-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - trusnova-net
    restart: unless-stopped

# ── Named Volumes ─────────────────────────────────────────────
volumes:
  backend-data:
    driver: local
  chroma-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  models-data:             # mount pre-trained ML pkl files here
    driver: local

# ── Network ───────────────────────────────────────────────────
networks:
  trusnova-net:
    driver: bridge
    name: trusnova-network
