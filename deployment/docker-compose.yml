# =============================================================
#  TrustNova AI — Docker Compose (full stack)
#  Docker Hub: chotu94/trusnova-{backend,frontend,ml}
#
#  Quick start (pull from Docker Hub — no source needed):
#    docker-compose pull && docker-compose up -d
#
#  Build from source and push:
#    docker-compose build
#    docker-compose push
#
#  Development (build + start):
#    docker-compose up --build
# =============================================================

services:

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    image: chotu94/trusnova-backend:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: trusnova-backend
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite:////app/data/banking.db
      - CHROMA_PERSIST_DIR=data/chroma_db
      - CHROMA_COLLECTION=banking_docs
      - CHROMA_HOST=trusnova-chromadb
      - CHROMA_PORT=8000
      - VECTOR_DB=chroma
      - LLM_PROVIDER=groq
      - LLM_MODEL=llama-3.3-70b-versatile
      - EMBEDDING_BACKEND=sentence_transformers
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── React Frontend (Nginx) ───────────────────────────────────
  frontend:
    image: chotu94/trusnova-frontend:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: trusnova-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── ML Inference Service ─────────────────────────────────────
  ml-service:
    image: chotu94/trusnova-ml:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ml
    container_name: trusnova-ml
    ports:
      - "8003:8001"
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── ChromaDB Vector Store ────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: trusnova-chromadb
    ports:
      - "8002:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── Prometheus (Metrics) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: trusnova-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - trusnova-net
    restart: unless-stopped

  # ── Grafana (Dashboards) ─────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: trusnova-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - trusnova-net
    restart: unless-stopped

# ── Named Volumes ─────────────────────────────────────────────
volumes:
  backend-data:
    driver: local
  chroma-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ── Network ───────────────────────────────────────────────────
networks:
  trusnova-net:
    driver: bridge
    name: trusnova-network
