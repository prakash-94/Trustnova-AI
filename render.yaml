services:
  - type: web
    name: trusnova-ai-backend
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements-render.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # Set this in Render dashboard → your PostgreSQL connection string
      - key: ENVIRONMENT
        value: production
      - key: VECTOR_DB
        value: pinecone
      - key: EMBEDDING_BACKEND
        value: openai
      - key: PINECONE_INDEX_NAME
        value: banking-index
      - key: RERANKER_ENABLED
        value: "false"
      # Set these in the Render dashboard — do NOT commit real values here
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false   # e.g. https://your-project.vercel.app

