services:
  - type: web
    name: trusnova-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trusnova-ai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      # Set these in the Render dashboard — do NOT commit real values here
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false   # e.g. https://your-project.vercel.app

databases:
  - name: trusnova-ai-db
    databaseName: trusnova
    plan: free