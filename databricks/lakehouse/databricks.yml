# Databricks Asset Bundle for the TrustNova lakehouse (Phase 2): the IBM AML dataset as one combined bank.
#   databricks bundle deploy -t staging -p trustnova        (staging = trustnova_staging, the two Small simulations)
#   databricks bundle run lakehouse -t staging -p trustnova
#   prod loads one size at a time:  ... run lakehouse -t prod --params variants=HIS,LIS   then HIM,LIM   then HIL,LIL
#
# Separate from the AML Copilot bundle at the repo root, so deploying this never touches those jobs.
# All logic lives in trustnova_lake (tested on a laptop with local Spark); jobs/*.py are two-line wrappers.
bundle:
  name: trustnova_lakehouse

variables:
  catalog:
    description: Unity Catalog catalog the lakehouse reads from and writes to
  variants:
    description: Simulations to load (HIS, HIM, HIL, LIS, LIM, LIL), comma-separated
    default: "HIS,LIS"
  ml_variants:
    description: Simulations the ML jobs train on and score (set per target, so runs need no comma-laden --params)
    default: "HIS,LIS"
  ml_ratio:
    description: Normal rows sampled per laundering row for training
    default: "50"

artifacts:
  lake_wheel:
    type: whl
    path: ../..   # the repo root's pyproject.toml packages aml_copilot and trustnova_lake
    build: python -m build --wheel --outdir databricks/lakehouse/.wheel
    files:
      - source: ./.wheel/*.whl

resources:
  jobs:
    lakehouse:
      name: trustnova-lakehouse-${bundle.target}
      description: IBM AML files -> Bronze -> Silver (+ restricted ground truth) -> Gold, then the quality gate.
      max_concurrent_runs: 1
      timeout_seconds: 21600
      parameters:
        - name: variants
          default: ${var.variants}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ./.wheel/*.whl
      tasks:
        - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: jobs/lake_bronze.py
            parameters: ["--catalog", "${var.catalog}", "--variants", "{{job.parameters.variants}}"]
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          environment_key: default
          spark_python_task:
            python_file: jobs/lake_silver.py
            parameters: ["--catalog", "${var.catalog}", "--variants", "{{job.parameters.variants}}"]
        - task_key: gold
          depends_on: [{ task_key: silver }]
          environment_key: default
          spark_python_task:
            python_file: jobs/lake_gold.py
            parameters: ["--catalog", "${var.catalog}", "--variants", "{{job.parameters.variants}}"]
        - task_key: quality
          depends_on: [{ task_key: gold }]
          environment_key: default
          spark_python_task:
            python_file: jobs/lake_quality.py
            parameters: ["--catalog", "${var.catalog}", "--variants", "{{job.parameters.variants}}"]

    # Phase 2B: ML detection. Train never promotes on its own: a model that passes the gate becomes @candidate,
    # and a person runs ml_promote after reading the evaluation in MLflow (the manual approval).
    ml_train:
      name: trustnova-ml-train-${bundle.target}
      description: Point-in-time features, then M1 (transaction risk) and M3 (pattern type) with LightGBM, evaluated against the rule baseline.
      max_concurrent_runs: 1
      timeout_seconds: 43200
      parameters:
        - name: variants
          default: ${var.ml_variants}
        - name: ratio
          default: ${var.ml_ratio}
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - ./.wheel/*.whl
              - lightgbm>=4.5,<5
              - scikit-learn>=1.4,<2
              - mlflow>=3.1,<4
      tasks:
        - task_key: features
          environment_key: ml
          spark_python_task:
            python_file: jobs/ml_features.py
            parameters: ["--catalog", "${var.catalog}", "--variants", "{{job.parameters.variants}}"]
        - task_key: train
          depends_on: [{ task_key: features }]
          environment_key: ml
          spark_python_task:
            python_file: jobs/ml_train.py
            parameters: ["--catalog", "${var.catalog}", "--variants", "{{job.parameters.variants}}",
                         "--ratio", "{{job.parameters.ratio}}"]

    ml_promote:
      name: trustnova-ml-promote-${bundle.target}
      description: The manual approval. Moves a model's @candidate to @champion. Run by a person after reading the evaluation.
      max_concurrent_runs: 1
      parameters:
        - name: model
          default: m1
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - ./.wheel/*.whl
              - mlflow>=3.1,<4
      tasks:
        - task_key: promote
          environment_key: ml
          spark_python_task:
            python_file: jobs/ml_promote.py
            parameters: ["--catalog", "${var.catalog}", "--model", "{{job.parameters.model}}"]

    ml_score:
      name: trustnova-ml-score-${bundle.target}
      description: The @champion model scores every transaction, then account-day scores and daily alerts with reason codes.
      max_concurrent_runs: 1
      timeout_seconds: 21600
      parameters:
        - name: variants
          default: ${var.ml_variants}
        - name: budget
          default: "25"
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - ./.wheel/*.whl
              - lightgbm>=4.5,<5
              - scikit-learn>=1.4,<2
              - mlflow>=3.1,<4
      tasks:
        - task_key: score
          environment_key: ml
          spark_python_task:
            python_file: jobs/ml_score.py
            parameters: ["--catalog", "${var.catalog}", "--variants", "{{job.parameters.variants}}",
                         "--budget", "{{job.parameters.budget}}"]

targets:
  staging:
    default: true
    mode: production
    variables:
      catalog: trustnova_staging
      variants: "HIS,LIS"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/staging
  prod:
    mode: production
    variables:
      catalog: trustnova_prod
      variants: "HIS,LIS"
      ml_variants: "HIS,HIM,HIL,LIS,LIM,LIL"
      ml_ratio: "10"
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
